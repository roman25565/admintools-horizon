[package]
name = "mod-admintools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AdminTools for Horizon: regions with mob rules, tick profiler, datapack structure search, test helpers"

[lib]
path = "src/lib.rs"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Every other
# dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
zip = { version = "9", default-features = false }
