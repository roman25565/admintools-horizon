# AdminTools' rules (admintools/api/src/core), built and tested without the game.
# `cargo test` here. Same dependency versions as Horizon's Cargo.lock.
[package]
name = "admintools-core-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
